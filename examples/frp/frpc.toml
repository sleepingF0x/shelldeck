# On the SAME machine as ShellDeck; run ShellDeck with:
# python3 shelldeck.py -H 127.0.0.1 -p 19000 --proxy-protocol v1
serverAddr = "{{ .Envs.SHELLDECK_FRP_SERVER_ADDR }}"
serverPort = 7000

auth.method = "token"
auth.token = "{{ .Envs.SHELLDECK_FRP_TOKEN }}"

transport.tls.enable = true
transport.tls.trustedCaFile = "{{ .Envs.SHELLDECK_FRP_CA_FILE }}"

[[proxies]]
name = "shelldeck"
type = "tcp"
localIP = "127.0.0.1"
localPort = 19000
remotePort = 9000
transport.proxyProtocolVersion = "v1"
