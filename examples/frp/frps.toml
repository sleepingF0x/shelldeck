# VPS. Export the variables described in docs/frp.md before verify/start.
bindAddr = "0.0.0.0"
bindPort = 7000
proxyBindAddr = "0.0.0.0"
allowPorts = [{ single = 9099 }]

auth.method = "token"
auth.token = "{{ .Envs.SHELLDECK_FRP_TOKEN }}"

transport.tls.force = true
transport.tls.certFile = "{{ .Envs.SHELLDECK_FRP_CERT_FILE }}"
transport.tls.keyFile = "{{ .Envs.SHELLDECK_FRP_KEY_FILE }}"
